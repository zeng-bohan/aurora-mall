server:
  shutdown: graceful
  port: 8086

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: aurora-payment
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_ADDR:localhost:13306}/aurora_payment?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:aurora123}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

aurora:
  config:
    required-keys: aurora.internal.secret,aurora.payment.channel-secret

management:
  endpoints:
    web:
      exposure:
        include: health,info
