server:
  port: 8082

spring:
  application:
    name: aurora-product
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_ADDR:localhost:13306}/aurora_product?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:aurora123}

spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:16379}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

aurora:
  cache:
    physical-ttl-seconds: 86400

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    # traceId rides every log line via the MDC key set by TraceIdFilter
    level: "%5p [${spring.application.name:},%X{traceId:-}]"
