server:
  shutdown: graceful
  port: 8082

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: aurora-product
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_ADDR:localhost:13306}/aurora_product?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:aurora123}

spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:16379}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# secret from the nacos config center; aurora.cache.physical-ttl-seconds
# also lives there (aurora-product.yml) so it can be refreshed at runtime
aurora:
  config:
    required-keys: aurora.internal.secret
  cache:
    bloom:
      reseed-interval-ms: ${BLOOM_RESEED_MS:300000}
  # 手写 RPC 导出（M3 T8）：true 时随上下文启动 RPC 监听并注册进 nacos
  rpc:
    enabled: ${AURORA_RPC_ENABLED:false}
    registry-addr: ${NACOS_ADDR:localhost:8848}
    host: ${RPC_HOST:127.0.0.1}
    # 0 = 随机端口（默认）：注册中心上报真实绑定端口，同机多实例不撞端口
    port: ${RPC_PORT:0}

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
