spring:
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        # starter 在 classpath 上，但测试从不导入配置数据；
        # 这里只是为了让 spring-cloud 的 "no spring.config.import" 检查安静下来
        import-check:
          enabled: false

# 明显是假的测试占位值：测试从不访问配置中心.
# seed-on-startup=false 是 CI 上下文加载运行的测试缝：
# 那里没有数据库，布隆过滤器保持为空（测试里的详情查询必须
# 自己播种 id）。
aurora:
  internal:
    secret: test-only-internal-secret-not-real
  cache:
    bloom:
      seed-on-startup: false
