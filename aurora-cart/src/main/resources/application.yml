server:
  port: 8083

spring:
  application:
    name: aurora-cart
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}

spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:16379}

# dev-only values; move to nacos config center in T5
aurora:
  internal:
    secret: dev-only-internal-secret-0123456789abcdef

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    # traceId rides every log line via the MDC key set by TraceIdFilter
    level: "%5p [${spring.application.name:},%X{traceId:-}]"
