server:
  shutdown: graceful
  port: 8083

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: aurora-cart
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}

spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:16379}

# secret from the nacos config center (see application-default.yml)
aurora:
  config:
    required-keys: aurora.internal.secret
  # 手写 RPC 切换（M3 T8）：true 时商品查询走 aurora-rpc，缺省走 OpenFeign
  rpc:
    enabled: ${AURORA_RPC_ENABLED:false}
    registry-addr: ${NACOS_ADDR:localhost:8848}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    # traceId rides every log line via the MDC key set by TraceIdFilter
    level: "%5p [${spring.application.name:},%X{traceId:-}]"
