# 仅在 default profile 下生效（即服务启动时未显式指定 profile）。
# test profile 从不加载本文件，因此单元测试与上下文测试无需配置中心即可运行。
# 这些值在首次启动前由 docker/nacos/import.sh 导入 dev 命名空间；
# 缺失时启动会快速失败——要么导入本身失败（缺 dataId），
# 要么 ConfigPresenceVerifier / @Value 在必需键无法解析时
# 拒绝启动（例如配置中心不可达）。
spring:
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: dev
  config:
    import:
      - nacos:aurora-common.yml
