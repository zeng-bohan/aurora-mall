server:
  shutdown: graceful
  port: 8087

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: aurora-seckill
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_ADDR:localhost:13306}/aurora_seckill?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:aurora123}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:16379}

# 内部密钥来自 nacos 配置中心（aurora-common.yml，见 application-default.yml）；
# ConfigPresenceVerifier 会在启动时失败，并指出缺失的必需键。
# 秒杀专属可调参数（活动维度限流阈值等）S3 引入时再加 aurora-seckill.yml 数据源。
aurora:
  config:
    required-keys: aurora.internal.secret
  seckill:
    # mq = 主链路：预扣成功后投递 MQ、消费者异步落单，请求路径完全不碰 DB；
    # sync = 同步落单，作为对照基线（M5 报告用它对比削峰效果）。
    order-mode: ${AURORA_SECKILL_ORDER_MODE:mq}
    # 活动维度限流（网关路由级限流之外的第二道闸）。这里是默认值，
    # 运行时以配置中心 aurora-seckill.yml 为准，可即时调整。
    rate-limit:
      enabled: true
      per-activity-limit: 200
      window-seconds: 1

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
