apiVersion: 1

groups:
  - orgId: 1
    name: aurora-mall-reliability
    folder: aurora-mall
    interval: 1m
    rules:
      - uid: order-5xx-ratio
        title: order 服务 5xx 比例过高
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: order 服务最近 2 分钟 5xx 比例超过 5%
        labels:
          severity: critical
          service: aurora-order
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'sum(rate(http_server_requests_seconds_count{application="aurora-order",status=~"5.."}[2m]))'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'sum(rate(http_server_requests_seconds_count{application="aurora-order"}[2m]))'
              instant: true
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0.05]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
              datasource:
                type: __expr__
              expression: '$A / $B'
              type: math
              refId: C
