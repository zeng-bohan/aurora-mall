name: aurora-mall

services:
  mysql:
    image: mysql:8.0
    container_name: aurora-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: aurora123
      MYSQL_DATABASE: aurora_mall
      TZ: Asia/Shanghai
    ports:
      # 宿主机的 3306/6379 被本机其他长期运行的项目占用；
      # 在宿主机上运行的服务通过 localhost:13306 / localhost:16379 连接
      - "127.0.0.1:13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 每服务一库的 DDL，首次启动时由官方镜像自动执行
      # （已有数据卷时需手动执行一次脚本）
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-paurora123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: aurora-redis
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: aurora-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 256m
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: aurora-rocketmq-namesrv
    # 镜像里没有 /home/rocketmq/logs 目录，挂载卷会归属 root；
    # 因此以 root 而非 uid 3000 运行，保证存储/日志路径可写
    user: "0"
    command: sh mqnamesrv
    ports:
      - "127.0.0.1:9876:9876"
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n localhost:9876 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: aurora-rocketmq-broker
    user: "0"
    command: sh mqbroker -c /home/rocketmq/conf/broker.conf
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    ports:
      # brokerIP1 通告 127.0.0.1，让宿主机上的客户端（IDE/mvn）可以连接；
      # M4 之前不预期编排内有调用方访问该 broker。
      - "127.0.0.1:10909:10909"
      - "127.0.0.1:10911:10911"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
      - rocketmq-broker-store:/home/rocketmq/store
      - rocketmq-broker-logs:/home/rocketmq/logs
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin brokerStatus -b 127.0.0.1:10911 >/dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 40s

  seata-server:
    image: apache/seata-server:2.5.0
    container_name: aurora-seata-server
    environment:
      TZ: Asia/Shanghai
      # 宿主可达地址：宿主机上的服务通过 nacos 解析到此
      SEATA_IP: "127.0.0.1"
      # 注入注册中心配置，而不替换镜像自带的默认 yml
      # （整文件挂载曾破坏 web-application-type/logback 默认值）
      SPRING_APPLICATION_JSON: '{"seata":{"registry":{"type":"nacos","nacos":{"application":"seata-server","server-addr":"nacos:8848","group":"DEFAULT_GROUP","cluster":"default"}}}}'
    ports:
      - "127.0.0.1:8091:8091"
    depends_on:
      nacos:
        condition: service_healthy

  # spec 服务清单之外的开发便利项：namesrv/broker 可视化界面
  # （镜像里没有 curl/wget/bash，因此改由 smoke.sh 从宿主机侧探测）
  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: aurora-rocketmq-dashboard
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Xms128m -Xmx128m"
    ports:
      - "127.0.0.1:8180:8080"

  # 9.7 这一代：H2 存储让开发栈保持单容器、轻量；
  # SkyWalking 10 移除了 H2（需要 BanyanDB/ES）——M4 时再评估
  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: aurora-skywalking-oap
    environment:
      SW_STORAGE: h2
      SW_TELEMETRY: prometheus
      JAVA_OPTS: "-Xms1g -Xmx1g"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:11800:11800"
      - "127.0.0.1:12800:12800"
    healthcheck:
      # OAP 9.7 没有 /healthcheck HTTP 路由，且镜像自带 wget 而非 curl；
      # prometheus 遥测端口返回 200 即证明服务已完全启动
      test: ["CMD-SHELL", "wget -qO- http://localhost:1234/metrics >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  skywalking-ui:
    image: apache/skywalking-ui:9.7.0
    container_name: aurora-skywalking-ui
    depends_on:
      skywalking-oap:
        condition: service_healthy
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    ports:
      - "127.0.0.1:8090:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: aurora-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.3.0
    container_name: aurora-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: aurora123
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  loki:
    image: grafana/loki:3.4.2
    container_name: aurora-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  nacos-logs:
  rocketmq-namesrv-logs:
  rocketmq-broker-store:
  rocketmq-broker-logs:
  prometheus-data:
  grafana-data:
  loki-data:
