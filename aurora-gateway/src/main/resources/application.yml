server:
  shutdown: graceful
  # host 8080 belongs to another long-running project on this dev machine
  port: 8000

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: aurora-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    gateway:
      server:
        webflux:
          routes:
            - id: user
              uri: lb://aurora-user
              predicates:
                - Path=/api/user/**
              filters:
                - StripPrefix=2
            - id: product
              uri: lb://aurora-product
              predicates:
                - Path=/api/product/**
              filters:
                - StripPrefix=2
            - id: cart
              uri: lb://aurora-cart
              predicates:
                - Path=/api/cart/**
              filters:
                - StripPrefix=2
            - id: order
              uri: lb://aurora-order
              predicates:
                - Path=/api/order/**
              filters:
                - StripPrefix=2
            - id: inventory
              uri: lb://aurora-inventory
              predicates:
                - Path=/api/inventory/**
              filters:
                - StripPrefix=2
            - id: payment
              uri: lb://aurora-payment
              predicates:
                - Path=/api/payment/**
              filters:
                - StripPrefix=2

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

# aurora.jwt.secret / aurora.internal.secret come from the nacos config center
# (application-default.yml import); startup fails fast when they are missing

spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:16379}
