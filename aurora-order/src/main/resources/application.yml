server:
  port: 8084

spring:
  application:
    name: aurora-order
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    # traceId rides every log line via the MDC key set by TraceIdFilter
    level: "%5p [${spring.application.name:},%X{traceId:-}]"

# secret from the nacos config center (see application-default.yml)
aurora:
  config:
    required-keys: aurora.internal.secret
