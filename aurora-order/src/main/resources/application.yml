server:
  shutdown: graceful
  port: 8084

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: aurora-order
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_ADDR:localhost:13306}/aurora_order?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:aurora123}

spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:16379}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

aurora:
  config:
    required-keys: aurora.internal.secret
  # mq = ADR-0003 main path (default); at = Seata AT comparison scenario
  tx:
    mode: ${AURORA_TX_MODE:mq}
  order:
    # RocketMQ delay level 16 = 30min; smoke tests shrink it via the config center
    close-delay-level: 16
    close-timeout-seconds: 1800
    tx-retry-interval-ms: 30000
    close-scan-interval-ms: 60000

seata:
  # AT 对照实验开关：默认关闭（ADR-0003 mq 主链路），经配置中心开启
  enabled: ${SEATA_ENABLED:false}
  application-id: aurora-order
  tx-service-group: aurora_tx_group
  service:
    vgroup-mapping:
      aurora_tx_group: default
    grouplist:
      # file registry 直连：宿主可达的 seata-server 地址
      default: ${SEATA_ADDR:127.0.0.1:8091}
  registry:
    type: file

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    # traceId rides every log line via the MDC key set by TraceIdFilter
    level: "%5p [${spring.application.name:},%X{traceId:-}]"
