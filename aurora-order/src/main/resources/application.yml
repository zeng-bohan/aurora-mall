server:
  shutdown: graceful
  port: 8084

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: aurora-order
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_ADDR:localhost:13306}/aurora_order?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:aurora123}

spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:16379}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

aurora:
  config:
    required-keys: aurora.internal.secret
  order:
    # RocketMQ 延迟级别 16 = 30 分钟；冒烟测试通过配置中心调小它
    close-delay-level: 16
    close-timeout-seconds: 1800
    tx-retry-interval-ms: 30000
    close-scan-interval-ms: 60000
    auto-complete-days: 7
    auto-complete-interval-ms: 600000
    refund-settle-interval-ms: 60000

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
