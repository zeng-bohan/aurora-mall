name: ci

# 只跑主干推送与面向主干的 PR：push 不限分支时，同仓 PR 会被 push + pull_request
# 双触发（同一个提交跑两遍）
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同分支新推送取消仍在跑的旧构建，省额度也省排队
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    # 钉具体版本而非 ubuntu-latest：2026-10-19 起 latest 会迁到 Ubuntu 26，
    # 那次基础镜像跳变不该顺带改变验收结果（要迁移时单独一次提交改这两处）
    runs-on: ubuntu-24.04
    services:
      # 真实中间件进必过项：Lua 库存/秒杀脚本、MySQL 事务与并发用例不再因缺环境跳过。
      # 端口与本地开发一致（13306/16379），测试代码里的默认值不用改。
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: aurora123
          MYSQL_ROOT_HOST: '%'
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -paurora123"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7
        ports:
          - 16379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      # action 按 commit SHA 钉死（供应链加固）：注释保留对应版本号，升级时两处一起改
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # 建库建表与本地 docker compose 使用同一组 SQL，避免 CI 与本地口径分叉
      - name: Load test schemas
        run: |
          for f in docker/mysql/init/*.sql; do
            echo "loading $f"
            docker exec -i "${{ job.services.mysql.id }}" mysql -uroot -paurora123 < "$f"
          done

      - name: Build and test
        env:
          MYSQL_ADDR: localhost:13306
          MYSQL_PASSWORD: aurora123
          REDIS_HOST: localhost
          REDIS_PORT: "16379"
        run: mvn -B clean verify

      # 真实中间件用例一旦被意外跳过，构建也要失败：防止 CI 变绿但核心证据没跑
      - name: Assert middleware tests ran
        run: |
          grep -R "Tests run:" aurora-seckill/target/surefire-reports/*.txt
          grep -R "Tests run:" aurora-inventory/target/surefire-reports/*.txt
          grep -R "Tests run:" aurora-order/target/surefire-reports/*.txt
          grep -R "Tests run:" aurora-payment/target/surefire-reports/*.txt
          grep -q "SeckillOrderServiceIntegrationTest" aurora-seckill/target/surefire-reports/*.txt
          grep -q "StockServiceIntegrationTest" aurora-inventory/target/surefire-reports/*.txt
          grep -q "TradeServiceIntegrationTest" aurora-order/target/surefire-reports/*.txt
          grep -q "PaymentServiceTest" aurora-payment/target/surefire-reports/*.txt
          ! grep -R "Skipped: [1-9]" aurora-seckill/target/surefire-reports/*.txt
          ! grep -R "Skipped: [1-9]" aurora-inventory/target/surefire-reports/*.txt
          ! grep -R "Skipped: [1-9]" aurora-order/target/surefire-reports/*.txt
          ! grep -R "Skipped: [1-9]" aurora-payment/target/surefire-reports/*.txt

      # 复用测试 job 的构建产物：docker-build 不再重复一次全量 package
      - name: Upload service jars
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-jars
          path: aurora-*/target/*.jar
          if-no-files-found: error

      # 失败时把测试报告捞上来：CI 日志要登录才能看，产物是唯一可离线排障的入口
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: aurora-*/target/surefire-reports/
          if-no-files-found: ignore

  # 前端独立成 job：与 Java 构建并行，不依赖 JDK，也不需要中间件。
  # 它验的是"类型检查 + 打包能不能过"——aurora-web 是独立工具链，
  # 不接进来它就会在没人注意的时候烂掉。
  web-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: aurora-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          # 锁文件不在仓库根，缓存路径得显式指到子目录
          cache-dependency-path: aurora-web/package-lock.json

      # npm ci 而不是 install：锁文件是依赖树的唯一真相，CI 不该顺手改它
      - run: npm ci

      - run: npm run build

  docker-build:
    runs-on: ubuntu-24.04
    needs: build-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download service jars
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: service-jars
          path: jars

      # docker/Dockerfile.service 的 COPY 以 aurora-<svc>/target/*.jar 为上下文路径，把 jar 归位。
      # download-artifact 按 upload 时的仓库相对路径还原（jars/aurora-<svc>/target/…），
      # 用 find 递归取回再按模块名放置
      - name: Place jars back into module targets
        run: |
          while read -r jar; do
            name="$(basename "$jar" -0.1.0-SNAPSHOT.jar)"
            mkdir -p "$name/target"
            cp "$jar" "$name/target/"
          done < <(find jars -name 'aurora-*-0.1.0-SNAPSHOT.jar')

      # 用共用的 docker/Dockerfile.service 构建全部服务镜像：验证这一份定义对 7 个
      # 服务都可用。顺序固定便于对照；CI 从不推送镜像，发布是手动步骤。
      - name: Build service images
        run: |
          services="gateway user product cart order inventory payment seckill"
          for name in $services; do
            ls "aurora-$name"/target/*.jar > /dev/null 2>&1 \
              || { echo "missing jar for aurora-$name"; exit 1; }
          done
          for name in $services; do
            echo "::group::docker build aurora-$name"
            docker build -f docker/Dockerfile.service -t "aurora-$name:$GITHUB_SHA" "aurora-$name"
            echo "::endgroup::"
          done
