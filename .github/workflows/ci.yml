name: ci

on:
  push:
  pull_request:

# 同分支新推送取消仍在跑的旧构建，省额度也省排队
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

      # 复用测试 job 的构建产物：docker-build 不再重复一次全量 package
      - name: Upload service jars
        uses: actions/upload-artifact@v7
        with:
          name: service-jars
          path: aurora-*/target/*.jar
          if-no-files-found: error

  docker-build:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v7

      - name: Download service jars
        uses: actions/download-artifact@v8
        with:
          name: service-jars
          path: jars

      # Dockerfile 的 COPY 以 aurora-<svc>/target/*.jar 为上下文路径，把 jar 归位。
      # download-artifact 按 upload 时的仓库相对路径还原（jars/aurora-<svc>/target/…），
      # 用 find 递归取回再按模块名放置
      - name: Place jars back into module targets
        run: |
          while read -r jar; do
            name="$(basename "$jar" -0.1.0-SNAPSHOT.jar)"
            mkdir -p "$name/target"
            cp "$jar" "$name/target/"
          done < <(find jars -name 'aurora-*-0.1.0-SNAPSHOT.jar')
          for dockerfile in */Dockerfile; do
            context="$(dirname "$dockerfile")"
            ls "$context"/target/*.jar > /dev/null || { echo "missing jar for $context"; exit 1; }
          done

      # 在本地构建每个服务镜像，验证 Dockerfile 可用。
      # CI 从不推送镜像；发布是手动步骤。
      - name: Build service images
        run: |
          shopt -s nullglob
          found=0
          for dockerfile in */Dockerfile; do
            context="$(dirname "$dockerfile")"
            name="$(basename "$context")"
            echo "::group::docker build $name"
            docker build -t "aurora-$name:$GITHUB_SHA" "$context"
            echo "::endgroup::"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "no service Dockerfiles found yet (services land in T3)"
          fi
