name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

  docker-build:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Package jars
        run: mvn -B package -DskipTests

      # Builds every service image locally to prove the Dockerfiles work.
      # Images are never pushed from CI; publishing is a manual release step.
      - name: Build service images
        run: |
          shopt -s nullglob
          found=0
          for dockerfile in */Dockerfile; do
            context="$(dirname "$dockerfile")"
            name="$(basename "$context")"
            echo "::group::docker build $name"
            docker build -t "aurora-$name:$GITHUB_SHA" "$context"
            echo "::endgroup::"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "no service Dockerfiles found yet (services land in T3)"
          fi
