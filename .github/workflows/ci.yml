name: ci

# 只跑主干推送与面向主干的 PR：push 不限分支时，同仓 PR 会被 push + pull_request
# 双触发（同一个提交跑两遍）
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同分支新推送取消仍在跑的旧构建，省额度也省排队
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    # 钉具体版本而非 ubuntu-latest：2026-10-19 起 latest 会迁到 Ubuntu 26，
    # 那次基础镜像跳变不该顺带改变验收结果（要迁移时单独一次提交改这两处）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

      # 复用测试 job 的构建产物：docker-build 不再重复一次全量 package
      - name: Upload service jars
        uses: actions/upload-artifact@v7
        with:
          name: service-jars
          path: aurora-*/target/*.jar
          if-no-files-found: error

      # 失败时把测试报告捞上来：CI 日志要登录才能看，产物是唯一可离线排障的入口
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: aurora-*/target/surefire-reports/
          if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-24.04
    needs: build-test
    steps:
      - uses: actions/checkout@v7

      - name: Download service jars
        uses: actions/download-artifact@v8
        with:
          name: service-jars
          path: jars

      # docker/Dockerfile.service 的 COPY 以 aurora-<svc>/target/*.jar 为上下文路径，把 jar 归位。
      # download-artifact 按 upload 时的仓库相对路径还原（jars/aurora-<svc>/target/…），
      # 用 find 递归取回再按模块名放置
      - name: Place jars back into module targets
        run: |
          while read -r jar; do
            name="$(basename "$jar" -0.1.0-SNAPSHOT.jar)"
            mkdir -p "$name/target"
            cp "$jar" "$name/target/"
          done < <(find jars -name 'aurora-*-0.1.0-SNAPSHOT.jar')

      # 用共用的 docker/Dockerfile.service 构建全部服务镜像：验证这一份定义对 7 个
      # 服务都可用。顺序固定便于对照；CI 从不推送镜像，发布是手动步骤。
      - name: Build service images
        run: |
          services="gateway user product cart order inventory payment"
          for name in $services; do
            ls "aurora-$name"/target/*.jar > /dev/null 2>&1 \
              || { echo "missing jar for aurora-$name"; exit 1; }
          done
          for name in $services; do
            echo "::group::docker build aurora-$name"
            docker build -f docker/Dockerfile.service -t "aurora-$name:$GITHUB_SHA" "aurora-$name"
            echo "::endgroup::"
          done
