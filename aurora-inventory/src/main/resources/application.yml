server:
  shutdown: graceful
  port: 8085

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: aurora-inventory
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_ADDR:localhost:13306}/aurora_inventory?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:aurora123}

spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:16379}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

aurora:
  config:
    required-keys: aurora.internal.secret
  stock:
    reconcile-interval-ms: 60000

seata:
  # AT 对照实验开关：默认关闭（mq 主链路），经配置中心开启
  enabled: ${SEATA_ENABLED:false}
  application-id: aurora-inventory
  tx-service-group: aurora_tx_group
  service:
    vgroup-mapping:
      aurora_tx_group: default
    grouplist:
      # file registry 直连：宿主可达的 seata-server 地址
      default: ${SEATA_ADDR:127.0.0.1:8091}
  registry:
    type: file

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
